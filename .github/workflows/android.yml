name: Build Android APK

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup NDK
        run: |
          # GitHub-hosted runners already have ANDROID_HOME / ANDROID_SDK_ROOT set.
          # We only need to install the right NDK version.
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.2.12479018" \
            "cmake;3.22.1" 2>&1 | grep -v "^Unzip\|^Decompressing\| KB/s\|  "
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Cache CMake / NDK build
        uses: actions/cache@v4
        with:
          path: |
            android/app/.cxx
            android/app/build/intermediates/cmake
          key: cmake-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'runtime/**/*.cpp', 'runtime/**/*.h') }}
          restore-keys: cmake-${{ runner.os }}-

      - name: Build debug APK
        working-directory: android
        env:
          PES17_NDK_VERSION: "27.2.12479018"
          PES17_NATIVE_OPTIMISATION: "-O2"
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pes2017-recomp-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: APK info
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            echo "✅ APK gerado: $APK"
            ls -lh "$APK"
          else
            echo "❌ APK não encontrado"
            exit 1
          fi
